name: Release

# Publishes the package and the library ports in packages/ to GitHub
# Packages: every version there that GitHub Packages doesn't have yet
# (scripts/release.js plan), from main (dist-tags latest and vX.Y-stable)
# or a release line, release/X.Y (vX.Y-stable). See docs/releasing.md.
#
# Run it by hand on the branch (Actions, Release, Run workflow). With
# "publish" ticked it publishes: for the package, prebuilt host libraries
# for x86_64 and aarch64 (Debug for run-linux, Release for package-linux)
# and a GitHub release, v<version>, with them attached, which the package
# lists with their checksums (prebuilt-hosts.json); for each port, a tag,
# <name>@<version>. Unticked it's a dry run: it builds and packs
# everything, runs `npm publish --dry-run`, and publishes nothing.
#
# Pull requests that change a version run the dry run, without the hosts.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (unticked, a dry run)
        type: boolean
        default: false
  pull_request:
    paths:
      - package.json
      - packages/*/package.json
      - CHANGELOG.md
      - packages/*/CHANGELOG.md
      - rn-version.properties
      - scripts/release.js
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.plan.outputs.core }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@curiosity26'
      - name: Every package on React Native's major.minor
        run: scripts/release.js check
      - name: What GitHub Packages doesn't have yet
        id: plan
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          scripts/release.js plan --json >plan.json
          node -e '
            const p = JSON.parse(require("fs").readFileSync("plan.json", "utf8"));
            const core = p.packages.find(q => q.id === "core");
            const rows = p.packages.map(q => `| ${q.name} | ${q.version} | ${q.published ? "published" : "to publish"} |`);
            const tags = p.distTags ? p.distTags.join(", ") : "none (not main or a release/X.Y branch: dry run only)";
            console.log([
              `### ${process.env.PUBLISH === "true" ? "Publishing" : "Dry run"}: ${p.branch}, React Native ${p.line}`,
              "", `dist-tags: ${tags}`, "", "| package | version | |", "|---|---|---|", ...rows,
            ].join("\n"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `core=${!core.published}\nversion=${core.version}\n`);
            if (process.env.PUBLISH === "true" && !p.distTags) {
              console.error(`::error::publish from main or release/${p.line}, not ${p.branch}`);
              process.exit(1);
            }
          ' | tee -a "$GITHUB_STEP_SUMMARY"

  host:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.core == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build \
            pkg-config python3 libgtk-4-dev libsoup-3.0-dev libssl-dev libicu-dev libreadline-dev
      - name: Build the hosts (Debug and Release)
        run: |
          scripts/prebuilt-host.js build dist
          scripts/prebuilt-host.js build dist --release
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [plan, host]
    # The hosts are skipped when the package isn't being released.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.host.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) && ' ' || '--dry-run' }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@curiosity26'
      - name: Test
        run: npm test
      - uses: actions/download-artifact@v4
        if: needs.host.result == 'success'
        with:
          pattern: host-*
          path: dist
          merge-multiple: true
      - name: List the prebuilt hosts in the package
        if: needs.host.result == 'success'
        run: |
          scripts/prebuilt-host.js manifest dist \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
      - name: Release notes
        if: needs.plan.outputs.core == 'true'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " {p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          cat notes.md
      - name: GitHub release with the prebuilt hosts
        if: needs.plan.outputs.core == 'true' && env.DRY_RUN != '--dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ github.ref_name == 'main' }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # A run that stopped before publishing the package: this run's hosts.
            gh release upload "v$VERSION" dist/*.tar.gz --clobber
          else
            gh release create "v$VERSION" dist/*.tar.gz --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file notes.md --latest="$LATEST"
          fi
      - name: Publish the package
        run: scripts/release.js publish core $DRY_RUN
      - name: Publish the library ports
        run: scripts/release.js publish libraries $DRY_RUN
