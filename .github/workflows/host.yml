name: Host

# Builds rn-gtk-host (the GTK host and its test harness) and runs every
# gallery self-test (ctest) headless, under GNOME's compositor (Wayland) and
# X11, on Ubuntu 24.04 (GTK 4.14, our floor) and 26.04 (GTK 4.22, the
# current LTS). X11 is Xvfb with mutter as its window manager on 24.04, and
# Xwayland under mutter on 26.04 (mutter 49+ has no X11 mode). React
# Native, Hermes and the third-party C++ libraries are cached per Ubuntu by
# the versions and scripts that make them; the host's own objects by ccache.

on:
  # Pull requests only: what merges has already passed here.
  pull_request:

# Reads the repository; nothing here writes with the token.
permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-tests-os:
    name: self-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # GTK 4.14, our floor (same base as Linux Mint 22.3).
          - os: ubuntu-24.04
            x11: x11
          # GTK 4.22: gtk-interface-color-scheme, at-spi2-core 2.60.
          - os: ubuntu-26.04
            x11: xwayland
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      # The accessibility self-test reads the app over AT-SPI.
      GTK_A11Y: atspi
    steps:
      - uses: actions/checkout@v7
      - name: Install the build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config python3 ccache \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libssl-dev libicu-dev libreadline-dev \
            xvfb xauth x11-utils xwayland mutter dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 \
            fonts-dejavu-core
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # (restore and save apart: a cache step saves only when the whole job
      # passes, and these are worth keeping when a self-test fails.)
      - name: Restore React Native, Hermes and the C++ dependencies
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: third-party/deps
          key: deps-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rn-version.properties', 'scripts/fetch-rn-deps.py', 'scripts/build-hermes.sh', 'scripts/codegen-deps/**') }}
      - name: Fetch React Native and build Hermes
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch-rn-deps.py
          scripts/build-hermes.sh
      - name: Save them
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: third-party/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Bundle the example
        run: |
          npm ci --prefix examples/hello-world
          npm run bundle:hello-world

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ runner.arch }}-
      - name: Build rn-gtk-host
        id: build
        run: |
          cmake -S linux -B build/linux -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux
          ccache --show-stats
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Self-tests on Wayland (mutter)
        run: scripts/run-headless.sh wayland -- ctest --test-dir build/linux --output-on-failure
      - name: Self-tests on X11 (${{ matrix.x11 == 'x11' && 'Xvfb' || 'Xwayland' }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/run-headless.sh ${{ matrix.x11 }} -- ctest --test-dir build/linux --output-on-failure

  # The check the rulesets require (.github/rulesets): passes when the
  # self-tests passed on every Ubuntu above.
  self-tests:
    needs: self-tests-os
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every Ubuntu passed
        run: test "${{ needs.self-tests-os.result }}" = success
