name: CodeQL

# Code scanning ("advanced setup"; replaces GitHub's default setup, which
# can't take a config file and only scans main). Scans main, the release
# lines and pull requests into them, plus weekly for new queries.
# The config (.github/codeql/codeql-config.yml) leaves out overrides/, whose
# Flow syntax CodeQL can't parse.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
