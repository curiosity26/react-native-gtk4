name: JS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Metro platform tests
        run: npm test
      - name: Install the example
        run: npm ci --prefix examples/hello-world
      - name: Metro platform tests against React Native 0.83.10
        run: npm test
      - name: Bundle the example for --platform linux
        run: npm run bundle:hello-world
