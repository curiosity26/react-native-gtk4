      - dependency-name: react
    groups:
      release-0.84-patches:
        patterns: ["*"]
    commit-message:
      prefix: "deps(release/0.84)"

  - package-ecosystem: npm
    directories:
      - /examples/hello-world
      - /scripts/codegen-deps
    target-branch: release/0.85
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native
      - dependency-name: "@react-native/*"
      - dependency-name: react
    groups:
      release-0.85-patches:
        patterns: ["*"]
    commit-message:
      prefix: "deps(release/0.85)"

  - package-ecosystem: npm
    directories:
      - /examples/hello-world
      - /scripts/codegen-deps
    target-branch: release/0.86
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native
